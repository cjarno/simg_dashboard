<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMG Dashboard - ANZCA Job Matcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #334155;
        }

        h1 {
            color: #38bdf8;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #1e293b;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #334155;
            min-width: 150px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .stat-card .label {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }

        .filters {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            height: fit-content;
        }

        .filters h3 {
            color: #38bdf8;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 8px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        .btn-secondary {
            background: #475569;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #64748b;
        }

        .btn-danger {
            background: #ef4444;
            color: #fff;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #22c55e;
            color: #fff;
        }

        .btn-success:hover {
            background: #16a34a;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .job-list {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            min-height: 400px;
        }

        .job-list h3 {
            color: #38bdf8;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .spinner {
            border: 3px solid #334155;
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .job-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #334155;
            transition: all 0.2s;
        }

        .job-card:hover {
            border-color: #38bdf8;
            transform: translateX(5px);
        }

        .job-card h4 {
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .job-card .company {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .job-card .location {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .job-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .job-card .tag {
            background: #334155;
            color: #e2e8f0;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 3px;
        }

        .job-card .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #334155;
        }

        .job-card .actions .btn {
            margin: 0;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .favorites-panel {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            height: fit-content;
        }

        .favorites-panel h3 {
            color: #f43f5e;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .favorite-card {
            background: #0f172a;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
            border: 1px solid #334155;
            font-size: 0.85rem;
        }

        .favorite-card a {
            color: #38bdf8;
            text-decoration: none;
        }

        .favorite-card a:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .log-panel {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
        }

        .log-panel h4 {
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #1e293b;
        }

        .log-entry .time {
            color: #64748b;
            margin-right: 10px;
        }

        .log-entry .level-info {
            color: #38bdf8;
        }

        .log-entry .level-warning {
            color: #f59e0b;
        }

        .log-entry .level-error {
            color: #ef4444;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 SIMG Dashboard</h1>
            <p class="subtitle">ANZCA Job Matching Platform for NSW German Doctors</p>
        </header>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="value" id="jobs-count">0</div>
                <div class="label">Total Jobs</div>
            </div>
            <div class="stat-card">
                <div class="value" id="favorites-count">0</div>
                <div class="label">Favorites</div>
            </div>
            <div class="stat-card">
                <div class="value" id="api-status">Connecting...</div>
                <div class="label">API Status</div>
            </div>
        </div>

        <div class="main-content">
            <div class="filters">
                <h3>🔍 Filters</h3>
                
                <div class="filter-group">
                    <label>Job Type</label>
                    <select id="job-type">
                        <option value="">All Types</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Contract">Contract</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Keywords</label>
                    <input type="text" id="keywords" placeholder="Search keywords...">
                </div>

                <div class="filter-group">
                    <label>Source</label>
                    <select id="source">
                        <option value="">All Sources</option>
                        <option value="seek">SEEK</option>
                        <option value="linkedin">LinkedIn</option>
                        <option value="indeed">Indeed</option>
                        <option value="medical_boards">Medical Boards</option>
                    </select>
                </div>

                <button class="btn" onclick="loadJobs()">🔄 Refresh Jobs</button>
                <button class="btn btn-secondary" onclick="scrapeJobs()">🌐 Scrape New Jobs</button>
                <button class="btn btn-secondary" onclick="loadFavorites()">⭐ Load Favorites</button>
            </div>

            <div class="job-list">
                <h3>📋 Job Listings</h3>
                <div id="jobs-container">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading jobs...</p>
                    </div>
                </div>
            </div>

            <div class="favorites-panel">
                <h3>⭐ My Favorites</h3>
                <div id="favorites-container">
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No favorites yet</p>
                        <p style="margin-top: 10px; font-size: 0.8rem;">Click the star icon to add jobs to favorites</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="log-panel">
            <h4>📊 Activity Log</h4>
            <div id="log-container">
                <p style="color: #64748b;">Waiting for activity...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api/v1';
        let jobs = [];
        let favorites = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAPIStatus();
            setInterval(checkAPIStatus, 10000);
            loadJobs();
            loadFavorites();
            setInterval(loadFavorites, 30000);
        });

        // API Status
        async function checkAPIStatus() {
            try {
                const res = await fetch(`${API_BASE}/health`);
                if (res.ok) {
                    document.getElementById('api-status').textContent = '✓ Healthy';
                    document.getElementById('api-status').style.color = '#22c55e';
                }
            } catch (e) {
                document.getElementById('api-status').textContent = '✗ Offline';
                document.getElementById('api-status').style.color = '#ef4444';
            }
        }

        // Log to UI
        function log(message, level = 'info') {
            const container = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="time">[${time}]</span><span class="level-${level}">${message}</span>`;
            container.insertBefore(entry, container.firstChild);
            container.scrollTop = container.scrollHeight;
        }

        // Load Jobs
        async function loadJobs() {
            const container = document.getElementById('jobs-container');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading jobs...</p>
                </div>
            `;

            try {
                const jobType = document.getElementById('job-type').value;
                const keywords = document.getElementById('keywords').value;
                const source = document.getElementById('source').value;

                let url = `${API_BASE}/jobs/`;
                if (jobType) url += `?job_type=${encodeURIComponent(jobType)}`;
                if (keywords) url += `&keywords=${encodeURIComponent(keywords)}`;
                if (source) url += `&source=${encodeURIComponent(source)}`;

                const res = await fetch(url);
                const data = await res.json();
                jobs = data.jobs || [];

                document.getElementById('jobs-count').textContent = jobs.length;
                renderJobs();
                log(`Loaded ${jobs.length} jobs`);
            } catch (e) {
                console.error('Error loading jobs:', e);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>Error loading jobs</p>
                        <p style="margin-top: 10px; font-size: 0.8rem;">${e.message}</p>
                    </div>
                `;
                log('Error loading jobs', 'error');
            }
        }

        // Render Jobs
        function renderJobs() {
            const container = document.getElementById('jobs-container');
            
            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No jobs found</p>
                        <p style="margin-top: 10px; font-size: 0.8rem;">Try scraping for new jobs or adjusting filters</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = jobs.map(job => `
                <div class="job-card">
                    <h4>${job.title}</h4>
                    <div class="company">${job.company}</div>
                    <div class="location">📍 ${job.location}</div>
                    ${job.job_type ? `<div style="color: #64748b; font-size: 0.8rem; margin-bottom: 5px;">${job.job_type}</div>` : ''}
                    ${job.salary_min ? `<div style="color: #64748b; font-size: 0.8rem; margin-bottom: 5px;">💰 $${job.salary_min.toLocaleString()} - $${job.salary_max?.toLocaleString()}</div>` : ''}
                    <div class="tags">
                        ${job.tags?.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="actions">
                        <button class="btn btn-secondary" onclick="toggleFavorite('${job.id}', '${job.title}')">
                            ${job.is_favorited ? '★ Favorited' : '☆ Favorite'}
                        </button>
                        <a href="${job.url}" target="_blank" class="btn btn-success">View Job</a>
                    </div>
                </div>
            `).join('');
        }

        // Toggle Favorite
        async function toggleFavorite(jobId, jobTitle) {
            const isFav = favorites.some(f => f.job_id === jobId);
            
            if (isFav) {
                await removeFavorite(jobId);
            } else {
                await addFavorite(jobId, jobTitle);
            }
            
            loadFavorites();
            loadJobs(); // Refresh job list to update favorite status
        }

        // Add Favorite
        async function addFavorite(jobId, jobTitle) {
            try {
                const res = await fetch(`${API_BASE}/favorites/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: jobId, job_title: jobTitle, job_url: '' })
                });
                if (res.ok) {
                    log(`Added to favorites: ${jobTitle}`);
                    return true;
                }
            } catch (e) {
                console.error('Error adding favorite:', e);
            }
            return false;
        }

        // Remove Favorite
        async function removeFavorite(jobId) {
            try {
                const res = await fetch(`${API_BASE}/favorites/${jobId}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    log(`Removed from favorites`);
                    return true;
                }
            } catch (e) {
                console.error('Error removing favorite:', e);
            }
            return false;
        }

        // Load Favorites
        async function loadFavorites() {
            try {
                const res = await fetch(`${API_BASE}/favorites/`);
                const data = await res.json();
                favorites = data.favorites || [];
                
                document.getElementById('favorites-count').textContent = favorites.length;
                
                const container = document.getElementById('favorites-container');
                if (favorites.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <p>No favorites yet</p>
                            <p style="margin-top: 10px; font-size: 0.8rem;">Click the star icon to add jobs to favorites</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = favorites.map(fav => `
                        <div class="favorite-card">
                            <a href="${fav.job_url}" target="_blank">${fav.job_title}</a>
                            <div style="color: #64748b; font-size: 0.75rem; margin-top: 5px;">Added: ${new Date(fav.added_at).toLocaleDateString()}</div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error('Error loading favorites:', e);
            }
        }

        // Scrape Jobs
        async function scrapeJobs() {
            const container = document.getElementById('jobs-container');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Scraping job boards...</p>
                </div>
            `;
            
            try {
                const res = await fetch(`${API_BASE}/jobs/scrape`, {
                    method: 'POST'
                });
                const data = await res.json();
                log(`Scraped ${data.total_scraped} jobs from multiple sources`);
                loadJobs();
            } catch (e) {
                console.error('Error scraping jobs:', e);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>Error scraping jobs</p>
                        <p style="margin-top: 10px; font-size: 0.8rem;">${e.message}</p>
                    </div>
                `;
                log('Error scraping jobs', 'error');
            }
        }

        // Filter events
        document.getElementById('job-type').addEventListener('change', loadJobs);
        document.getElementById('keywords').addEventListener('input', loadJobs);
        document.getElementById('source').addEventListener('change', loadJobs);
    </script>
</body>
</html>
